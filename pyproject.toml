[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coding-agent-harness"
version = "0.1.0"
description = "Evidence-driven harness for bounded coding tasks and reviewer-controlled remediation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "psutil>=7.0",
  "typer>=0.16",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
coding-harness = "coding_agent_harness.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
