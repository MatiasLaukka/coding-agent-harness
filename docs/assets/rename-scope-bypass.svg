<svg xmlns="http://www.w3.org/2000/svg" width="640" height="782" viewBox="0 0 560 684" role="img" aria-labelledby="rename-title rename-desc">
<title id="rename-title">A rename hid an out-of-scope deletion</title>
<desc id="rename-desc">Verified R2 reproduction: only renamed.txt was allowed. With rename detection enabled, name-only evidence could include the destination but omit existing.txt, allowing controller acceptance. The correction disables rename collapsing in both path collectors, includes both endpoints, and yields scope-violation for this example. Scope detection does not prevent or roll back the write.</desc>
<defs>
<marker id="rename-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 1 L7 4 L0 7" fill="none" stroke="#bbc9d1" stroke-width="1.4"/>
</marker>
</defs>
<rect width="560" height="684" rx="16" fill="#11191f"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="36" fill="#6de0ce" font-size="20" font-weight="600">04 / ADVERSARIAL CASE / PR #4</text>
<text x="24" y="78" fill="#f2f6f8" font-size="30" font-weight="650">A rename hid a deletion.</text>
<rect x="24" y="102" width="512" height="116" rx="10" fill="#1b272f" stroke="#536875" stroke-width="1.5"/>
<text x="44" y="135" fill="#f2f6f8" font-size="24" font-weight="400">Allowed file: renamed.txt</text>
<text x="44" y="171" fill="#f2f6f8" font-size="27" font-weight="650">existing.txt  →  renamed.txt</text>
<text x="44" y="202" fill="#bbc9d1" font-size="21" font-weight="400">The source was outside the allowed scope.</text>
<path d="M280 218 V240" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#rename-arrow)"/>
<rect x="24" y="244" width="512" height="130" rx="10" fill="#1b272f" stroke="#f1a3a3" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="44" y="277" fill="#f1a3a3" font-size="20" font-weight="600">BEFORE / INCOMPLETE PATH EVIDENCE</text>
<text x="44" y="310" fill="#f2f6f8" font-size="24" font-weight="400">changed_files: [renamed.txt]</text>
<text x="44" y="340" fill="#f2f6f8" font-size="20" font-weight="400">Assumption: the path list covers every change.</text>
<text x="44" y="363" fill="#f1a3a3" font-size="22" font-weight="400">Accept request → accepted</text>
<path d="M280 374 V396" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#rename-arrow)"/>
<rect x="24" y="400" width="512" height="156" rx="10" fill="#1b272f" stroke="#6de0ce" stroke-width="1.5"/>
<text x="44" y="433" fill="#6de0ce" font-size="20" font-weight="600">CORRECTION / --no-renames</text>
<text x="44" y="466" fill="#f2f6f8" font-size="22" font-weight="400">Count the deletion and addition separately.</text>
<text x="44" y="497" fill="#6de0ce" font-size="25" font-weight="650">existing.txt  +  renamed.txt</text>
<text x="44" y="530" fill="#f2f6f8" font-size="23" font-weight="400">Accept request → scope-violation</text>
<text x="44" y="549" fill="#bbc9d1" font-size="20" font-weight="400">Both cumulative and per-attempt path collectors</text>
<text x="24" y="594" fill="#bbc9d1" font-size="21" font-weight="400">Tested: unstaged, staged and committed moves.</text>
<text x="24" y="625" fill="#f2f6f8" font-size="23" font-weight="650">The write already happened.</text>
<text x="24" y="655" fill="#bbc9d1" font-size="21" font-weight="400">Scope gates acceptance; it does not roll back.</text>
</g>
</svg>
