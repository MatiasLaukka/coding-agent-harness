<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1097" viewBox="0 0 560 960" role="img" aria-labelledby="human-title human-desc">
<title id="human-title">Human authority and one bounded remediation in control</title>
<desc id="human-desc">START with a fresh challenge and published start record precede baseline validation and first dispatch. Worker, Git capture, and verification precede review-entry freshness. Human ACCEPT or REMEDIATE requires a fresh challenge and rationale; STOP requires a rationale. Review record publication and final freshness precede controller decision validation and gates. Only enabled authorized remediation with budget remaining loops back. Failures abort; terminal records describe available outcomes, not resume authority.</desc>
<defs>
<marker id="human-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 1 L7 4 L0 7" fill="none" stroke="#bbc9d1" stroke-width="1.4"/>
</marker>
</defs>
<rect width="560" height="960" rx="16" fill="#11191f"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="36" fill="#6de0ce" font-size="20" font-weight="600">03 / HUMAN AUTHORITY / control</text>
<text x="24" y="78" fill="#f2f6f8" font-size="30" font-weight="650">Permission is a separate step.</text>
<rect x="24" y="100" width="512" height="90" rx="10" fill="#1b272f" stroke="#f1c27b" stroke-width="1.5"/>
<text x="44" y="133" fill="#f1c27b" font-size="25" font-weight="650">START + fresh challenge</text>
<text x="44" y="163" fill="#f2f6f8" font-size="21" font-weight="400">Publish start record; match clean baseline.</text>
<path d="M280 190 V212" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#human-arrow)"/>
<rect x="24" y="216" width="512" height="68" rx="10" fill="#1b272f" stroke="#536875" stroke-width="1.5"/>
<text x="44" y="245" fill="#f2f6f8" font-size="23" font-weight="400">Worker → Git capture → verification</text>
<text x="44" y="271" fill="#bbc9d1" font-size="20" font-weight="400">First dispatch, or one permitted remediation</text>
<path d="M280 284 V306" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#human-arrow)"/>
<rect x="24" y="310" width="512" height="62" rx="10" fill="#1b272f" stroke="#6de0ce" stroke-width="1.5"/>
<text x="44" y="348" fill="#6de0ce" font-size="24" font-weight="600">Review-entry freshness must match</text>
<path d="M280 372 V394" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#human-arrow)"/>
<rect x="24" y="398" width="512" height="130" rx="10" fill="#1b272f" stroke="#f1c27b" stroke-width="1.5"/>
<text x="44" y="430" fill="#f1c27b" font-size="20" font-weight="600">HUMAN REVIEWS THE EVIDENCE</text>
<text x="44" y="462" fill="#f1c27b" font-size="25" font-weight="650">ACCEPT / REMEDIATE</text>
<text x="44" y="490" fill="#f2f6f8" font-size="22" font-weight="400">Fresh action challenge + rationale</text>
<text x="44" y="516" fill="#bbc9d1" font-size="20" font-weight="400">STOP requires a rationale, no challenge.</text>
<path d="M280 528 V550" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#human-arrow)"/>
<rect x="24" y="554" width="512" height="92" rx="10" fill="#1b272f" stroke="#536875" stroke-width="1.5"/>
<text x="44" y="588" fill="#f2f6f8" font-size="24" font-weight="400">Publish the review decision record</text>
<text x="44" y="621" fill="#6de0ce" font-size="22" font-weight="400">Then check final freshness + deadline.</text>
<path d="M280 646 V668" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#human-arrow)"/>
<rect x="24" y="672" width="512" height="112" rx="10" fill="#1b272f" stroke="#f1c27b" stroke-width="1.5"/>
<text x="44" y="705" fill="#f1c27b" font-size="20" font-weight="600">CONTROLLER VALIDATES AND GATES</text>
<text x="44" y="736" fill="#f2f6f8" font-size="22" font-weight="400">Acceptance request → acceptance gates</text>
<text x="44" y="765" fill="#f2f6f8" font-size="22" font-weight="400">Remediation → instructions + budget</text>
<path d="M536 750 H548 V250 H536" fill="none" stroke="#f1c27b" stroke-width="2" marker-end="url(#human-arrow)"/>
<path d="M280 784 V806" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#human-arrow)"/>
<rect x="24" y="810" width="512" height="62" rx="10" fill="#1b272f" stroke="#536875" stroke-width="1.5"/>
<text x="44" y="848" fill="#f2f6f8" font-size="24" font-weight="400">Outcome → terminal record attempt</text>
<text x="24" y="905" fill="#bbc9d1" font-size="20" font-weight="400">Fixed scope · default 0 / maximum 1 remediation</text>
<text x="24" y="934" fill="#bbc9d1" font-size="20" font-weight="400">Failures abort. Saved requests are not receipts.</text>
</g>
</svg>
