<svg xmlns="http://www.w3.org/2000/svg" width="640" height="949" viewBox="0 0 560 830" role="img" aria-labelledby="life-title life-desc">
<title id="life-title">Coding Agent Harness: execution, evidence, review</title>
<desc id="life-desc">A clean baseline precedes worker execution. The worker supplies a claim. The harness separately captures Git evidence and then executes configured checks. Run returns findings without acceptance or retry. Control requires human review, freshness, and controller gates. One enabled and explicitly authorized remediation may repeat execution. Logical roles share OS permissions.</desc>
<defs>
<marker id="life-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 1 L7 4 L0 7" fill="none" stroke="#bbc9d1" stroke-width="1.4"/>
</marker>
</defs>
<rect width="560" height="830" rx="16" fill="#11191f"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="24" y="36" fill="#6de0ce" font-size="20" font-weight="600">01 / CODING AGENT HARNESS</text>
<text x="24" y="78" fill="#f2f6f8" font-size="30" font-weight="650">Trace the work. Then decide.</text>
<rect x="24" y="100" width="512" height="100" rx="10" fill="#1b272f" stroke="#536875" stroke-width="1.5"/>
<text x="44" y="130" fill="#bbc9d1" font-size="20" font-weight="600">TASK + CLEAN GIT BASELINE</text>
<text x="44" y="162" fill="#f2f6f8" font-size="23" font-weight="400">Goal · file scope · configured checks</text>
<text x="44" y="187" fill="#f1c27b" font-size="20" font-weight="400">control: START + start record first</text>
<path d="M280 200 V224" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#life-arrow)"/>
<rect x="24" y="228" width="512" height="96" rx="10" fill="#1b272f" stroke="#bbc9d1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="44" y="259" fill="#bbc9d1" font-size="20" font-weight="600">1  WORKER EXECUTION</text>
<text x="44" y="290" fill="#f2f6f8" font-size="23" font-weight="400">Subprocess returns a completion claim</text>
<text x="44" y="313" fill="#bbc9d1" font-size="20" font-weight="400">A parsed record is not proof of correctness.</text>
<path d="M280 324 V348" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#life-arrow)"/>
<rect x="24" y="352" width="512" height="94" rx="10" fill="#1b272f" stroke="#6de0ce" stroke-width="1.5"/>
<text x="44" y="382" fill="#6de0ce" font-size="20" font-weight="600">2  HARNESS OBSERVES GIT</text>
<text x="44" y="413" fill="#f2f6f8" font-size="23" font-weight="400">Paths · patch · HEAD · commits</text>
<text x="44" y="437" fill="#bbc9d1" font-size="20" font-weight="400">Captured after the worker, before checks.</text>
<path d="M280 446 V470" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#life-arrow)"/>
<rect x="24" y="474" width="512" height="94" rx="10" fill="#1b272f" stroke="#6de0ce" stroke-width="1.5"/>
<text x="44" y="505" fill="#6de0ce" font-size="20" font-weight="600">3  HARNESS RUNS VERIFICATION</text>
<text x="44" y="536" fill="#f2f6f8" font-size="23" font-weight="400">Observe configured command outcomes</text>
<text x="44" y="559" fill="#bbc9d1" font-size="20" font-weight="400">Passing checks do not grant permission.</text>
<path d="M280 568 V584 H12 V734" fill="none" stroke="#bbc9d1" stroke-width="2"/>
<path d="M12 634 H24 M12 734 H24" fill="none" stroke="#bbc9d1" stroke-width="2" marker-end="url(#life-arrow)"/>
<rect x="24" y="598" width="512" height="74" rx="10" fill="#1b272f" stroke="#536875" stroke-width="1.5"/>
<text x="44" y="628" fill="#f2f6f8" font-size="23" font-weight="650">run</text>
<text x="121" y="628" fill="#f2f6f8" font-size="23" font-weight="400">→ mechanical findings</text>
<text x="44" y="657" fill="#bbc9d1" font-size="21" font-weight="400">No reviewer acceptance or retry.</text>
<rect x="24" y="686" width="512" height="96" rx="10" fill="#1b272f" stroke="#f1c27b" stroke-width="1.5"/>
<text x="44" y="716" fill="#f1c27b" font-size="23" font-weight="650">control</text>
<text x="151" y="716" fill="#f2f6f8" font-size="23" font-weight="400">→ human review + gates</text>
<text x="44" y="745" fill="#f2f6f8" font-size="21" font-weight="400">Freshness · explicit action · available records</text>
<text x="44" y="770" fill="#bbc9d1" font-size="20" font-weight="400">At most one enabled, authorized remediation.</text>
<text x="24" y="812" fill="#bbc9d1" font-size="20" font-weight="400">Logical separation. Shared OS permissions.</text>
</g>
</svg>
